version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: activite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: activite_user
      POSTGRES_PASSWORD: activite_password
      POSTGRES_DB: activite_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activite_user -d activite_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
