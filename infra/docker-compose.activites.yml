services:
  activites-db:
    image: postgres:16-alpine
    container_name: activites-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: activite_user
      POSTGRES_PASSWORD: activite_password
      POSTGRES_DB: activite_db
    volumes:
      - activites_pg:/var/lib/postgresql/data
    networks:
      - web

  activites-web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: activites-web
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://activite_user:activite_password@activites-db:5432/activite_db?schema=public"
      AUTH_URL: "https://activites.tanoswebservice.fr"
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: "${AUTH_SECRET}"
      # Optional: Redis for rate limiting (uses in-memory fallback if not set)
      REDIS_URL: "${REDIS_URL:-}"
      # Optional: Stripe
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_ID: "${STRIPE_PRICE_ID:-}"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}"
      # Optional: Email (SMTP)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      # Optional: Cloudflare Turnstile
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}"
    volumes:
      - activites_uploads:/app/public/uploads
    depends_on:
      - activites-db
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  web:
    external: true
    name: infra_default

volumes:
  activites_pg:
  activites_uploads:
